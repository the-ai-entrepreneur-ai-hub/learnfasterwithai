<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Extension Icons</title>
  <style>
    body {
      font-family: Georgia, serif;
      padding: 20px;
      background: #f5f0e8;
    }
    h1 {
      color: #2c1810;
    }
    canvas {
      border: 2px solid #8b7355;
      margin: 10px;
      background: white;
    }
    button {
      background: #8b7355;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
      border-radius: 4px;
    }
    button:hover {
      background: #6b5544;
    }
    .icons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-item {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>AI Learning Accelerator - Icon Generator</h1>
  <p>Click "Generate Icons" to create placeholder icons, then right-click each to save.</p>

  <button onclick="generateIcons()">Generate Icons</button>

  <div class="icons-container" id="icons-container"></div>

  <script>
    function generateIcons() {
      const sizes = [16, 32, 48, 128];
      const container = document.getElementById('icons-container');
      container.innerHTML = '';

      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext('2d');

        // Background - vintage paper color
        ctx.fillStyle = '#f5f0e8';
        ctx.fillRect(0, 0, size, size);

        // Border - bronze color
        ctx.strokeStyle = '#8b7355';
        ctx.lineWidth = Math.max(1, size / 32);
        ctx.strokeRect(0, 0, size, size);

        // Inner circle - gold accent
        const centerX = size / 2;
        const centerY = size / 2;
        const radius = size / 3;

        ctx.fillStyle = '#d4a574';
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#8b7355';
        ctx.lineWidth = Math.max(1, size / 32);
        ctx.stroke();

        // Text "AI"
        ctx.fillStyle = '#2c1810';
        ctx.font = `bold ${size / 3}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('AI', centerX, centerY);

        // Create download link
        const iconItem = document.createElement('div');
        iconItem.className = 'icon-item';

        const label = document.createElement('p');
        label.textContent = `${size}x${size}px`;

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `icon${size}.png`;
        link.appendChild(canvas);

        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = `Download ${size}x${size}`;
        downloadBtn.onclick = () => link.click();

        iconItem.appendChild(label);
        iconItem.appendChild(link);
        iconItem.appendChild(document.createElement('br'));
        iconItem.appendChild(downloadBtn);

        container.appendChild(iconItem);
      });
    }

    // Auto-generate on page load
    window.onload = generateIcons;
  </script>
</body>
</html>
